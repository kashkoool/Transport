server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version.
    server_tokens off;

    # Compress text assets on the wire. Angular's build ships raw .js/.css (no precompressed
    # .gz/.br), and the stock image only gzips text/html — so JS/CSS/SVG/JSON went out uncompressed
    # (~3.5x larger than needed). gzip is always available in the base image; this is the single
    # biggest transfer-size win for FCP/LCP.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript text/javascript application/json
        text/css image/svg+xml application/xml application/manifest+json
        font/ttf font/otf;

    # Long-cache fingerprinted assets; never cache index.html (so new deploys are picked up).
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SEO sitemap is generated by the API — proxy the pretty /sitemap.xml URL to it so it's served
    # same-origin at the canonical location crawlers expect (also referenced in robots.txt).
    location = /sitemap.xml {
        proxy_pass http://api:8080/api/seo/sitemap.xml;
        proxy_http_version 1.1;
        # Deliberately do NOT forward the client Host here: the sitemap's absolute <loc> URLs come
        # from the API's configured Seo:PublicBaseUrl, so a spoofed Host header must never be able to
        # inject attacker-controlled origins into the sitemap. Pin an explicit upstream Host instead.
        proxy_set_header Host api;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt is a static asset shipped in the build (public/robots.txt → dist root); the SPA
    # fallback `location /` serves it via try_files $uri. No extra rule needed.

    # Proxy the API to the backend service (same-origin to the browser, so the SameSite=Strict
    # refresh cookie works). 'api' is the compose service name; override the upstream for other
    # deployments.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prerendered (SSG) + SPA fallback.
    #   1. `$uri`            → a hashed asset, robots.txt, etc.
    #   2. `$uri/index.html` → a PRERENDERED page, e.g. /bus/damascus-to-aleppo/index.html. Matching
    #                          the file directly serves it 200 at the NO-trailing-slash URL, which is
    #                          exactly the canonical + sitemap URL. (Falling through to `$uri/` instead
    #                          would make nginx 301 to add a slash — a canonical pointing at a
    #                          redirect. Serving the file avoids that.)
    #   3. `$uri/`           → any other directory index (defensive).
    #   4. fallback          → /index.csr.html, the empty client-render shell, for every route that is
    #                          NOT prerendered (login, register, account, vendor/*, admin/*, booking).
    #                          Using the home index.html here would wrongly serve home content (and its
    #                          canonical/JSON-LD) on those URLs — index.csr.html is the neutral shell.
    location / {
        try_files $uri $uri/index.html $uri/ /index.csr.html;
        add_header Cache-Control "no-cache";
    }
}
