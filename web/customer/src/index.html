<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TPX Travel — Book bus trips across Syria</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- The full-viewport hero is the landing LCP element and loads via a CSS background-image, which
       the preload scanner can't discover — preload it so the fetch starts immediately. -->
  <link rel="preload" as="image" href="assets/hero.jpg" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Changa (display) + Cairo (body) carry both Latin and Arabic, so the same type system works
       in English and Arabic. Inter/Space Grotesk kept as Latin fallbacks. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Changa:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
