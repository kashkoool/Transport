name: deploy

# Builds production images and publishes them to GitHub Container Registry (GHCR) on every push
# to main. No external cloud account or long-lived secrets needed — GHCR auth uses the built-in
# GITHUB_TOKEN. A host/orchestrator then pulls these images (see DEPLOYMENT.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # queue deploys; don't cancel one mid-flight

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      # GHCR requires all-lowercase names; the owner is lowercase and the suffixes are literal.
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/transport-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/transport-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TransportPlatform.Api/Dockerfile
          push: true
          pull: true
          platforms: linux/amd64
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push web image
        uses: docker/build-push-action@v6
        with:
          context: web/customer
          file: web/customer/Dockerfile
          push: true
          pull: true
          platforms: linux/amd64
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Images published" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.API_IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.WEB_IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
