name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release
      # ubuntu-latest has a running Docker daemon, so the Testcontainers integration tests
      # (real Postgres) run here too — unit + integration.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  frontend:
    name: frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/customer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/customer/package-lock.json
      - run: npm ci
      - name: Build (fails the budget if the bundle grows too large)
        run: npm run build
      - name: Lint
        run: npx ng lint

  docker-build:
    name: docker build smoke (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/TransportPlatform.Api/Dockerfile
          push: false
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: web/customer
          file: web/customer/Dockerfile
          push: false
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
