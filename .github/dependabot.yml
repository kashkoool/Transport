version: 2
updates:
  # .NET (central package management — Directory.Packages.props at the root).
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]

  # Angular customer app.
  - package-ecosystem: npm
    directory: "/web/customer"
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular*"]

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Base images in the Dockerfiles.
  - package-ecosystem: docker
    directory: "/src/TransportPlatform.Api"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/web/customer"
    schedule:
      interval: weekly
